[package]
name = "rivet-canvas"
description = "GPU 2D renderer for Rivet (OpenGL 3.3 Core + EGL): primitives, batching, textures, effects."
keywords = ["opengl", "renderer", "gpu", "2d"]
categories = ["rendering::engine", "graphics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
glow = "0.18.0"
rivet-base.workspace = true

[dev-dependencies]
criterion.workspace = true
khronos-egl = { version = "6.0.0", features = ["dynamic"] }

[[bench]]
name = "gl"
harness = false
