[package]
name = "rivet-window"
description = "Native Wayland client for Rivet: xdg_shell, layer_shell, input, and buffer management."
keywords = ["wayland", "client", "xdg-shell", "layer-shell"]
categories = ["os::linux-apis", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2.190"
rivet-base.workspace = true
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "wayland-client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "wayland-client"] }
xkbcommon = "0.9.0"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "memfd"
harness = false
