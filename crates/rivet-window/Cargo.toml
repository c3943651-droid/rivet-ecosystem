[package]
name = "rivet-window"
description = "Cliente Wayland nativo de Rivet: socket, wl_registry, xdg_shell, layer_shell, entrada y buffers (wl_shm, DMA-BUF)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2.190"
rivet-foundation.workspace = true
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "wayland-client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "wayland-client"] }
xkbcommon = "0.9.0"
