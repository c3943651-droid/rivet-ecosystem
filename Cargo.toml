[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/c3943651-droid/rivet-ecosystem"
rust-version = "1.75"

[workspace.dependencies]
rivet-base = { path = "crates/rivet-base", version = "0.1.2" }
rivet-window = { path = "crates/rivet-window", version = "0.1.2" }
rivet-canvas = { path = "crates/rivet-canvas", version = "0.1.2" }
rivet-typography = { path = "crates/rivet-typography", version = "0.1.2" }
rivet-image = { path = "crates/rivet-image", version = "0.1.2" }
rivet-style = { path = "crates/rivet-style", version = "0.1.2" }
rivet-ui = { path = "crates/rivet-ui", version = "0.1.2" }
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
